# =========================================================
# ChezPrecious — chezprecious.com
# Les apps tournent en conteneurs Docker (docker-compose.yml à la racine)
# et sont publiées sur 127.0.0.1 :
#   - site  (Next.js)  -> 127.0.0.1:9010
#   - api   (AdonisJS) -> 127.0.0.1:9011
#   - admin (Next.js)  -> 127.0.0.1:9012
#
# Installé par deploy/setup-server.sh dans
# /etc/nginx/sites-available/chezprecious.conf. Les blocs HTTPS sont ajoutés
# par « certbot --nginx », comme pour les autres sites du serveur.
# =========================================================

# www -> domaine principal
server {
    listen 80;
    listen [::]:80;
    server_name www.chezprecious.com;
    return 301 https://chezprecious.com$request_uri;
}

# API — api.chezprecious.com
server {
    listen 80;
    listen [::]:80;
    server_name api.chezprecious.com;

    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:9011;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }
}

# Admin — admin.chezprecious.com
server {
    listen 80;
    listen [::]:80;
    server_name admin.chezprecious.com;

    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:9012;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }
}

# Site — chezprecious.com
server {
    listen 80;
    listen [::]:80;
    server_name chezprecious.com;

    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:9010;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }
}
